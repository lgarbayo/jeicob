name: test
permissions: read-all
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync --extra mcp
      - name: Run smoke tests
        run: |
          uv run python -m jeicob.tools
          uv run --extra mcp python -m jeicob.mcp_smoke
          uv run python -m jeicob.rag

  qdrant-server:
    # Misma prueba de ingesta/consulta contra Qdrant en servidor (QDRANT_URL),
    # con la versión fijada en docker-compose.yml y API key obligatoria.
    runs-on: ubuntu-latest
    services:
      qdrant:
        image: qdrant/qdrant:v1.18.0@sha256:b3063c673f3973877c038eeecc392bad5011f072ee7892b56c9a8e204a3bdea9
        ports:
          - 6333:6333
        env:
          QDRANT__SERVICE__API_KEY: ci-test-key
          QDRANT__TELEMETRY_DISABLED: "true"
    env:
      QDRANT_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Install uv
        run: pip install uv
      - name: Install dependencies
        run: uv sync
      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            curl -sf -H "api-key: $QDRANT_API_KEY" http://localhost:6333/collections && exit 0
            sleep 2
          done
          exit 1
      - name: Run RAG smoke test against the server
        run: uv run python -m jeicob.rag --url http://localhost:6333
